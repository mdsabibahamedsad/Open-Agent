# OpenAgent production deployment overlay.
#
# Usage:
#   cp .env.production.example .env   # fill ALL required values first
#   docker compose -f docker-compose.production.yml up -d --build
#
# Design rules encoded here:
# - No default passwords: every secret comes from the environment (.env or
#   Docker/Kubernetes secrets). The file refuses to start without them
#   (variable expansion with :? error messages).
# - PostgreSQL and Redis are NOT published to the host (internal network
#   only). Only api (internal) and web (via your reverse proxy) are exposed.
# - All services: healthchecks, restart policies, non-root where the image
#   supports it (api/worker/scheduler run as appuser; web image hardening
#   to non-root is documented future work — see docs/release/release-notes.md).
# - No privileged containers, no host networking, no Docker socket mounts,
#   no host filesystem mounts (code is baked into images, not bind-mounted).
# - Web runs `pnpm start` (production Next.js server). The image MUST contain
#   a production build (.next); build it with: docker compose -f
#   docker-compose.production.yml build web   (runs `pnpm build` first via
#   the web Dockerfile only if adapted — otherwise build .next in CI and
#   COPY it in. See docs/deployment/self-hosted.md).
#
# LIMITATION (honest): api/worker/scheduler images reuse the development
# Dockerfiles' runtime layout (uvicorn without --reload for api, worker
# entrypoints). They are production-suitable but not minimal multi-stage
# images; image-size optimization was explicitly deferred per policy.

name: openagent-prod

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-openagent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD is required}",
      ]
    volumes:
      - redis_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      OPENAGENT_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      API_URL: ${API_URL:?API_URL is required}
      WEB_URL: ${WEB_URL:?WEB_URL is required}
    ports:
      - "127.0.0.1:8000:8000" # loopback only — expose via reverse proxy, never 0.0.0.0 directly
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      OPENAGENT_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_BASE: http://api:8000/api/v1
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?WORKER_SERVICE_TOKEN is required}
      WORKER_REGION: ${CLOUD_DEFAULT_REGION:-local-1}
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    stop_grace_period: 65s # SIGTERM drains in-flight jobs; SIGKILL after deadline

  scheduler:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    environment:
      OPENAGENT_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      API_BASE: http://api:8000/api/v1
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?WORKER_SERVICE_TOKEN is required}
      SCHEDULER_POLL_SECONDS: ${SCHEDULER_POLL_SECONDS:-15}
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "worker.cloud_scheduler"]
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    command: server /data --console-address ":9001"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: ${API_URL:?API_URL is required}/api/v1
    ports:
      - "127.0.0.1:3000:3000" # loopback only — TLS terminates at your reverse proxy
    networks:
      - internal
    restart: unless-stopped
    depends_on:
      - api
    command: ["pnpm", "start"] # production server; image must contain a `pnpm build` output

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
