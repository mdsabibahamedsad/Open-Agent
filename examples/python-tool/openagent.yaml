manifest_version: "1"
name: my-org/slugify
version: 1.0.0
display_name: Slugify
description: Convert titles to URL slugs (Python tool).
author: {name: OpenAgent Examples, email: examples@openagent.dev}
license: MIT
repository: https://github.com/openagent/openagent
type: tool
runtime: {language: python, entrypoint: src/slugify.py}
permissions: [tool:execute]
capabilities: [text.slugify]
events: [tool.completed.v1, tool.failed.v1]
compatibility: {openagent: ">=1.0.0 <2.0.0", sdk: ">=1.0.0 <2.0.0",
  extension_api: "1.x", api_version: v1}
security: {trust_level: UNTRUSTED, network_policy: none}
