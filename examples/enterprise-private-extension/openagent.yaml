manifest_version: "1"
name: acme-corp/vault-agent
version: 1.0.0
display_name: Vault Agent
description: Private org-only agent with SSO/RBAC and egress allowlist.
author: {name: Acme Corp, email: platform@acme.example}
license: UNLICENSED
repository: https://git.acme.example/platform/vault-agent
type: agent
runtime: {language: typescript, entrypoint: src/index.ts}
permissions: [tool:execute, model:invoke, secret:access]
capabilities: [vault.lookup]
secrets: [ACME_VAULT_TOKEN]
required_services: [sso, credential-store]
events: [agent.run.completed.v1]
compatibility: {openagent: ">=1.0.0 <2.0.0", sdk: ">=1.0.0 <2.0.0",
  extension_api: "1.x", api_version: v1}
security:
  trust_level: ORGANIZATION
  network_policy: allowlisted
  allowed_hosts: [vault.acme.example]
  risk_notes: Private listing; SSO group acme-platform required.
