version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: openagent-postgres
    environment:
      POSTGRES_USER: openagent
      POSTGRES_PASSWORD: openagent
      POSTGRES_DB: openagent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openagent -d openagent"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openagent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: openagent-api
    environment:
      OPENAGENT_ENV: development
      LOG_LEVEL: debug
      DATABASE_URL: postgresql+asyncpg://openagent:openagent@postgres:5432/openagent
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: development-secret-key-min-32-chars-long
      ENCRYPTION_KEY: development-encryption-key-min-32-chars
      CORS_ORIGINS: http://localhost:3000,http://localhost:8000
      API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/alembic.ini:/app/alembic.ini
      - ./apps/api/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn openagent.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: openagent-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/package.json:/app/package.json
      - ./apps/web/tsconfig.json:/app/tsconfig.json
      - ./apps/web/next.config.js:/app/next.config.js
      - ./apps/web/tailwind.config.js:/app/tailwind.config.js
      - ./apps/web/postcss.config.js:/app/postcss.config.js
    depends_on:
      - api
    command: npm run dev

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: openagent-worker
    environment:
      OPENAGENT_ENV: development
      LOG_LEVEL: debug
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://openagent:openagent@postgres:5432/openagent
      API_BASE: http://api:8000/api/v1
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:-development-worker-token-min-32-chars}
      WORKER_REGION: local-1
      WORKER_POOL: default
      WORKER_CAPABILITIES: exec,code
      WORKER_QUEUES: workflow.default,agent.default,code,sandbox
      OPENAGENT_CLOUD_ENABLED: ${OPENAGENT_CLOUD_ENABLED:-true}
    volumes:
      - ./apps/worker/src:/app/src
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "worker.cloud_worker"]
    stop_grace_period: 65s

  scheduler:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: openagent-scheduler
    environment:
      OPENAGENT_ENV: development
      LOG_LEVEL: debug
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://openagent:openagent@postgres:5432/openagent
      API_BASE: http://api:8000/api/v1
      WORKER_SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:-development-worker-token-min-32-chars}
      SCHEDULER_POLL_SECONDS: 15
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: ["python", "-m", "worker.cloud_scheduler"]
    stop_grace_period: 30s

  minio:
    image: minio/minio:RELEASE.2024-12-13T22-19-12Z
    container_name: openagent-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-openagent}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-openagent-minio-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  redis_data:
  minio_data: