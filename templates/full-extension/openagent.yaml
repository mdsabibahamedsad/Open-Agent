manifest_version: "1"
name: my-org/hello
version: 1.0.0
display_name: Hello automation-pack
description: Starter automation-pack template (hello-world).
author: {name: Your Name, email: you@example.com}
license: MIT
type: automation-pack
runtime: {language: typescript, entrypoint: src/index.ts}
permissions: [agent:invoke, workflow:execute]
capabilities: [hello]
compatibility: {openagent: ">=1.0.0 <2.0.0", sdk: ">=1.0.0 <2.0.0",
  extension_api: "1.x", api_version: v1}
security: {trust_level: UNTRUSTED, network_policy: none}
