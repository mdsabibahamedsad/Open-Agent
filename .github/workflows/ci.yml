name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: openagent
          POSTGRES_PASSWORD: openagent
          POSTGRES_DB: openagent
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U openagent -d openagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./apps/api
        run: uv sync --dev

      - name: Run database migrations
        working-directory: ./apps/api
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://openagent:openagent@localhost:5432/openagent

      - name: Run tests
        working-directory: ./apps/api
        run: uv run pytest -v
        env:
          DATABASE_URL: postgresql+asyncpg://openagent:openagent@localhost:5432/openagent
          REDIS_URL: redis://localhost:6379/0
          OPENAGENT_ENV: test
          SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-min-32-chars-for-testing

      - name: Run lint
        working-directory: ./apps/api
        run: uv run ruff check .

      - name: Run typecheck
        working-directory: ./apps/api
        run: uv run mypy .

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        working-directory: ./apps/web
        run: pnpm test

      - name: Run lint
        working-directory: ./apps/web
        run: pnpm lint

      - name: Run typecheck
        working-directory: ./apps/web
        run: pnpm typecheck

      - name: Build
        working-directory: ./apps/web
        run: pnpm build

  worker-tests:
    name: Worker Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ./apps/worker
        run: uv sync --dev

      - name: Run tests
        working-directory: ./apps/worker
        run: uv run pytest -v
        env:
          REDIS_URL: redis://localhost:6379/0
          OPENAGENT_ENV: test

      - name: Run lint
        working-directory: ./apps/worker
        run: uv run ruff check .

      - name: Run typecheck
        working-directory: ./apps/worker
        run: uv run mypy .

  security-gate:
    name: Static Security Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run sandbox static security gate
        run: python scripts/sandbox_security_gate.py

      - name: Run connector adversarial suites (SSRF/OAuth/webhook/IDOR)
        working-directory: ./apps/api
        run: uv run pytest tests/test_connector_security.py tests/test_connectors.py -q
        env:
          OPENAGENT_ENV: test
          SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-min-32-chars-for-testing

      - name: Run identity security suites (auth/authZ/SSO/SCIM/zero-trust)
        working-directory: ./apps/api
        run: uv run pytest tests/test_identity_auth.py tests/test_identity_enterprise.py tests/test_identity_authz.py tests/test_identity_zerotrust.py tests/test_identity_security.py -q
        env:
          OPENAGENT_ENV: test
          SECRET_KEY: test-secret-key-min-32-chars-long-for-testing
          ENCRYPTION_KEY: test-encryption-key-min-32-chars-for-testing

      - name: Secret scanning (gitleaks, warning tier)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SBOM (informational)
        run: python scripts/sbom.py sbom.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
        continue-on-error: true

  package-tests:
    name: Package Tests (SDK + connector-sdk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test connector-sdk
        run: pnpm --filter @openagent/connector-sdk test

      - name: Typecheck connector-sdk
        run: pnpm --filter @openagent/connector-sdk typecheck

      - name: Typecheck public SDK
        run: pnpm --filter @openagent/sdk typecheck

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, backend-tests, frontend-tests, worker-tests, security-gate, package-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          push: false
          tags: openagent-api:test
          load: true

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          push: false
          tags: openagent-web:test
          load: true

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/worker
          push: false
          tags: openagent-worker:test
          load: true